name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install cmake ninja xcodegen
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Setup Dependencies & Fonts (best effort)
        run: |
          chmod +x scripts/build/ios/*.sh || true
          if [ -f scripts/build/ios/fetch-moltenvk.sh ]; then
            ./scripts/build/ios/fetch-moltenvk.sh || echo "fetch-moltenvk failed - continuing"
          else
            echo "fetch-moltenvk.sh not present, skipping"
          fi
          if [ -f scripts/build/ios/stage-fonts.sh ]; then
            ./scripts/build/ios/stage-fonts.sh || echo "stage-fonts failed - continuing"
          else
            echo "stage-fonts.sh not present, skipping"
          fi

      - name: Configure CMake
        env:
          VULKAN_SDK: /usr/local/share/vulkan
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          CMAKE_MAKE_PROGRAM=$(which ninja) cmake --preset ios-vulkan || {
            echo "CMake configure failed — printing diagnostics"
            [ -f CMakeCache.txt ] && sed -n '1,200p' CMakeCache.txt
            echo "=== CMakePresets.json ==="
            sed -n '1,200p' CMakePresets.json || true
            exit 1
          }

      - name: Build Generals Zero Hour (iOS)
        run: |
          set -o pipefail
          cmake --build build/ios-vulkan --target z_generals --config Release -- -v 2>&1 | tee build/build-output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT — printing tail of build log"
            tail -n 200 build/build-output.log || true
            exit $BUILD_EXIT
          fi

      - name: List build output (diagnostics)
        run: |
          echo "Listing build tree for debugging..."
          ls -la build || true
          ls -la build/ios-vulkan || true
          find build/ios-vulkan -maxdepth 3 -type f -ls || true

      - name: Package to IPA (safe)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ios-vulkan -name "*.app" -type d | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "Warning: .app file not found — skipping IPA packaging"
            echo "Dumping build/ios-vulkan contents for debug:"
            find build/ios-vulkan -maxdepth 5 -ls || true
            # create an empty placeholder archive so artifact step can upload something
            echo "No .app — creating placeholder text file"
            mkdir -p build/debug-artifact
            echo "No .app was produced on runner $(hostname) at $(date)" > build/debug-artifact/NO_APP.txt
            exit 0
          fi
          echo "Found App: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r GeneralsZH.ipa Payload
          cd ..

      - name: Upload build artifacts & IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-build
          path: |
            build/GeneralsZH.ipa
            build/build-output.log
            build/debug-artifact/**
            build/**
