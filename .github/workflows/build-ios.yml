name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize Submodules
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk || git submodule update --init --recursive

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Dependencies
        run: |
          brew install ninja meson pkg-config molten-vk glslang vulkan-headers

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Cache vcpkg installed artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            build/ios-vulkan/vcpkg_installed
          key: vcpkg-ios-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-ios-

      - name: Configure CMake
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:$PKG_CONFIG_PATH"
          
          # Tentukan lokasi MoltenVK dari Homebrew
          MVK_DIR=$(brew --prefix molten-vk)
          VK_HEADERS_DIR=$(brew --prefix vulkan-headers)

          cmake -S . -B build/ios-vulkan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSAGE_USE_MOLTENVK=ON \
            -DSAGE_DXVK_USE_LOCAL_FORK=ON \
            -DCMAKE_MAKE_PROGRAM=/opt/homebrew/bin/ninja \
            -DMESON_EXECUTABLE=/opt/homebrew/bin/meson \
            -DMESON=/opt/homebrew/bin/meson \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DVulkan_INCLUDE_DIR="$VK_HEADERS_DIR/include" \
            -DVulkan_LIBRARY="$MVK_DIR/lib/libMoltenVK.dylib" \
            -DMoltenVK_INCLUDE_DIR="$MVK_DIR/include" \
            -DMoltenVK_LIBRARY="$MVK_DIR/lib/libMoltenVK.dylib"

      - name: Build Generals Zero Hour (iOS)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cmake --build build/ios-vulkan --target z_generals --config Release

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          find build/ios-vulkan -name "*.app" -exec cp -r {} build/Payload/ \;
          cd build && zip -r GeneralsZH.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/GeneralsZH.ipa
