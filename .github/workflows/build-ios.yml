name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install cmake ninja xcodegen meson
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Setup Dependencies & MoltenVK
        run: |
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure CMake
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          # Opsi A: Jika preset SUDAH mengatur konfigurasi iOS dan vcpkg sendiri:
          cmake --preset ios-vulkan \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DMESON_EXECUTABLE=$(which meson)

          # CATATAN: Jika proyek memang mewajibkan toolchain vcpkg manual,
          # gunakan vcpkg arm64-ios triplet agar tidak dianggap macOS:
          # cmake --preset ios-vulkan \
          #   -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          #   -DVCPKG_TARGET_TRIPLET=arm64-ios

      - name: Build Generals Zero Hour (iOS)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # Pakai preset langsung agar path output otomatis sesuai
          cmake --build --preset ios-vulkan --target z_generals --config Release

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find . -name "*.app" -type d | grep -v "DerivedData" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            find . -maxdepth 4 -type d -name "*generals*"
            exit 1
          fi
          echo "Found App: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r GeneralsZH.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-IPA
          path: build/GeneralsZH.ipa
